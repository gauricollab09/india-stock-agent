[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-advisor"
version = "0.1.0"
description = "Nifty 50 portfolio recommendation agent on Amazon Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.23,<2",
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langchain-aws>=1.7,<2",
    "boto3>=1.43",
    "botocore[crt]>=1.35",
    "pydantic>=2.10,<3",
    "yfinance>=1.7,<2",
    "pandas>=2.2,<4",
    "numpy>=2,<3",
    "aws-opentelemetry-distro~=0.18.0",
    "opentelemetry-instrumentation-langchain>=0.59",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["stock_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs AWS credentials and network access"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"stock_advisor/prompts.py" = ["E501"]
"stock_advisor/tools.py" = ["E501"]
"tests/*" = ["E501"]
